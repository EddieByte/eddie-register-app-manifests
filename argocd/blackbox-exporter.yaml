# Blackbox exporter: a "robot user" that loads /home.jsp every 30s and records
# whether it worked and how long it took. Needs the monitoring Application first
# (it creates ServiceMonitor objects, whose CRD comes from kube-prometheus-stack).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  # Deleting this Application also removes everything it installed (clean rollback).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.21.1
      helm:
        releaseName: blackbox-exporter
        valueFiles:
          - $values/monitoring/blackbox-exporter-values.yaml
    - repoURL: https://github.com/EddieByte/eddie-register-app-manifests.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
