apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eddie-register-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EddieByte/eddie-register-app-manifests.git
    targetRevision: HEAD
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: eddie-register-app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true