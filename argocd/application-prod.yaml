apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eddie-register-app-prod
  namespace: argocd
  annotations:
    # ArgoCD Notifications -> Slack #deployments. Harmless if notifications are not configured.
    notifications.argoproj.io/subscribe.on-deployed.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments
spec:
  project: default
  source:
    repoURL: https://github.com/EddieByte/eddie-register-app-manifests.git
    targetRevision: HEAD
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: eddie-register-app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
