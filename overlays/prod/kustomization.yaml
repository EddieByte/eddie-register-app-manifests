apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: eddie-register-app-deployment
    spec:
      replicas: 3

  - |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: eddie-register-app-ingress
    spec:
      rules:
        - host: register-app.example.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: eddie-register-app-service
                    port:
                      number: 80